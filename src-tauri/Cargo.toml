[package]
name = "lattice"
version = "3.1.9"
description = "Lattice 格致 - The Local-First, AI-Native Scientific Workbench"
authors = ["Lattice Team"]
license = "MIT"
repository = "https://github.com/tryandaction/lattice"
edition = "2021"

# Build configuration
[build-dependencies]
tauri-build = { version = "2", features = [] }

# Runtime dependencies
[dependencies]
tauri = { version = "2", features = ["devtools", "unstable"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2.6"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
percent-encoding = "2"
http = "1"
pdfium-auto = { version = "0.3", features = ["bundled"] }
pdfium-render = { version = "0.8.37", default-features = false, features = ["pdfium_latest"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify = "8.2"
sha2 = "0.10.9"
base64 = "0.22.1"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.0"
webview2-windows-core = { package = "windows-core", version = "=0.61.2" }
junction = "2.0.0"
windows = { version = "0.62.2", features = ["Foundation", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams"] }

# Feature flags
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Release profile optimizations
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = "debuginfo"
