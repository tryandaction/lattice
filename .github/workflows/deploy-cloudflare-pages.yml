name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - name: Require managed cloud public configuration
        run: test -n "$NEXT_PUBLIC_LATTICE_CLOUD_SERVICE"
        env:
          NEXT_PUBLIC_LATTICE_CLOUD_SERVICE: ${{ vars.LATTICE_CLOUD_SERVICE }}
      - run: npm run build
        env:
          NEXT_PUBLIC_LATTICE_CLOUD_SERVICE: ${{ vars.LATTICE_CLOUD_SERVICE }}

      - name: Validate static export
        run: test -f web-dist/index.html && test -f web-dist/library.html

      - name: Deploy to Cloudflare Pages
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## Cloudflare Pages Deploy"
            echo "- artifact path: \`web-dist\`"
            echo "- target project: \`lattice\`"
            echo "- target url: https://lattice-apq.pages.dev"
            echo "- status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
